{# Data transformation select — shared by the visualization-capable tools. #}
<div class="field">
    <label for="dataTransformation">Data transformation</label>
    <select id="dataTransformation" name="dataTransformation">
        <option value="No transformation">No transformation</option>
        <option value="Ln">Ln</option>
        <option value="Log">Log</option>
        <option value="Square">Square root</option>
        <option value="Z score">Z score</option>
    </select>
    <p class="field-help">Transformation applied when plotting charts. Charts spanning multiple documents are automatically normalized by document size.</p>
</div>

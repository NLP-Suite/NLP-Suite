name: tests

on:
  push:
    branches: [roberto]
  pull_request:
    branches: [roberto]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # The suite stubs the GUI/NLP stack in tests/conftest.py, so it stays
      # hermetic: only pytest is needed, no Stanza/spaCy/NLTK install. ruff (the version pre-commit pins) is for
      # tests/test_undefined_names.py, which lints all of src/ for undefined names (F821/F823).
      - run: pip install pytest ruff==0.15.16
      - run: pytest tests/ -v

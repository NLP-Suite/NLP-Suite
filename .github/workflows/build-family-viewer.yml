name: Build Family Archive Viewer

on:
  workflow_dispatch:
  push:
    tags:
      - 'fav-*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FamilyArchiveViewer-windows-x64
            python-version: '3.10'
          - os: macos-14
            artifact: FamilyArchiveViewer-mac-arm64
            python-version: '3.10'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: roberto

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller
          pip install --no-cache-dir pandas numpy openpyxl

      - name: Build Family Archive Viewer
        run: python -m PyInstaller FamilyArchiveViewer.spec --noconfirm

      - name: Build GEDCOM Converter
        run: python -m PyInstaller GedcomConverter.spec --noconfirm

      - name: Upload Family Archive Viewer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/FamilyArchiveViewer/
          retention-days: 30

      - name: Upload GEDCOM Converter
        uses: actions/upload-artifact@v4
        with:
          name: GedcomConverter-${{ matrix.os == 'windows-latest' && 'windows-x64' || 'mac-arm64' }}
          path: dist/GedcomConverter/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Zip artifacts
        run: |
          cd FamilyArchiveViewer-windows-x64 && zip -r ../FamilyArchiveViewer-windows-x64.zip . && cd ..
          cd FamilyArchiveViewer-mac-arm64 && zip -r ../FamilyArchiveViewer-mac-arm64.zip . && cd ..
          cd GedcomConverter-windows-x64 && zip -r ../GedcomConverter-windows-x64.zip . && cd ..
          cd GedcomConverter-mac-arm64 && zip -r ../GedcomConverter-mac-arm64.zip . && cd ..

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FamilyArchiveViewer-windows-x64.zip
            FamilyArchiveViewer-mac-arm64.zip
            GedcomConverter-windows-x64.zip
            GedcomConverter-mac-arm64.zip
          body: |
            Family Archive tools — standalone executables, no NLP Suite installation required.

            **Family Archive Viewer**: Interactive family tree, relations network, and migration map from CSV/Excel.
            **GEDCOM Converter**: Convert Ancestry .ged exports into Points/Links/Migration CSVs for the Viewer.

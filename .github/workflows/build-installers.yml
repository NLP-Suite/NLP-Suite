name: Build NLP Suite Installers

# Trigger: manually from the Actions tab, or on tagged releases
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NLP-Suite-windows-x64
            python-version: '3.10'
          - os: macos-14          # Apple Silicon (M1+)
            artifact: NLP-Suite-mac-arm64
            python-version: '3.10'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: roberto

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller
          pip install --no-cache-dir pandas numpy scipy scikit-learn openpyxl xlrd
          pip install --no-cache-dir stanza spacy nltk gensim textblob textstat nrclex
          pip install --no-cache-dir langdetect langid autocorrect pyspellchecker fuzzywuzzy
          pip install --no-cache-dir transformers sentence-transformers
          pip install --no-cache-dir matplotlib plotly "seaborn>=0.13.0" wordcloud mpld3 kaleido
          pip install --no-cache-dir folium geopy simplekml shapely geopandas
          pip install --no-cache-dir requests beautifulsoup4 lxml chardet tqdm psutil
          pip install --no-cache-dir pdfminer.six python-docx striprtf
          pip install --no-cache-dir pycorenlp stanfordcorenlp
          pip install --no-cache-dir Pillow
          pip install --no-cache-dir SPARQLWrapper

      - name: Build with PyInstaller
        run: python -m PyInstaller NLP_Suite.spec --noconfirm

      - name: Bundle portable Python environment
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist/NLP_Suite/python-env"
          PBS_TAG="20241002"

          if [ "$RUNNER_OS" = "macOS" ]; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
            PBS_URL="https://github.com/indygreg/python-build-standalone/releases/download/${PBS_TAG}/cpython-3.10.15+${PBS_TAG}-${ARCH}-apple-darwin-install_only_stripped.tar.gz"
          else
            PBS_URL="https://github.com/indygreg/python-build-standalone/releases/download/${PBS_TAG}/cpython-3.10.15+${PBS_TAG}-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          fi

          echo "Downloading portable Python from $PBS_URL"
          curl -fSL "$PBS_URL" -o /tmp/python-portable.tar.gz
          mkdir -p "$DIST"
          tar -xzf /tmp/python-portable.tar.gz -C "$DIST" --strip-components=1

          if [ "$RUNNER_OS" = "macOS" ]; then
            PYTHON="$DIST/bin/python3"
          else
            PYTHON="$DIST/python.exe"
          fi

          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install --no-cache-dir pandas numpy scipy scikit-learn openpyxl xlrd
          "$PYTHON" -m pip install --no-cache-dir stanza spacy nltk gensim textblob textstat nrclex
          "$PYTHON" -m pip install --no-cache-dir langdetect langid autocorrect pyspellchecker fuzzywuzzy
          "$PYTHON" -m pip install --no-cache-dir transformers sentence-transformers
          "$PYTHON" -m pip install --no-cache-dir matplotlib plotly "seaborn>=0.13.0" wordcloud mpld3 kaleido
          "$PYTHON" -m pip install --no-cache-dir folium geopy simplekml shapely geopandas
          "$PYTHON" -m pip install --no-cache-dir requests beautifulsoup4 lxml chardet tqdm psutil
          "$PYTHON" -m pip install --no-cache-dir pdfminer.six python-docx striprtf
          "$PYTHON" -m pip install --no-cache-dir pycorenlp stanfordcorenlp
          "$PYTHON" -m pip install --no-cache-dir Pillow
          "$PYTHON" -m pip install --no-cache-dir SPARQLWrapper
          # Verify
          "$PYTHON" -c "import pandas, requests, numpy; print('All critical packages OK')"
          echo "Bundled portable Python environment"

      - name: Bundle VC++ runtime DLLs into portable env (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $envDir = "dist/NLP_Suite/python-env"
          $sklearnLibs = Join-Path $envDir "lib/site-packages/sklearn/.libs"
          # VC++ runtime DLLs that sklearn and other native packages need
          $vcDlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "concrt140.dll", "vcomp140.dll")
          # Search system directories for the DLLs
          $searchPaths = @("C:\Windows\System32", "C:\Windows\SysWOW64")
          foreach ($dll in $vcDlls) {
            foreach ($searchPath in $searchPaths) {
              $src = Join-Path $searchPath $dll
              if (Test-Path $src) {
                # Copy to python-env root and sklearn .libs
                Copy-Item $src $envDir -ErrorAction SilentlyContinue
                if (Test-Path $sklearnLibs) {
                  Copy-Item $src $sklearnLibs -ErrorAction SilentlyContinue
                }
                Write-Host "Copied $dll from $searchPath"
                break
              }
            }
          }

      - name: Copy data directories to dist (all platforms)
        shell: python
        run: |
          import shutil, os, glob
          dist = 'dist/NLP_Suite'
          for d in ['lib', 'config', 'TIPS', 'reminders']:
              if os.path.isdir(d):
                  dst = os.path.join(dist, d)
                  if os.path.exists(dst):
                      shutil.rmtree(dst)
                  shutil.copytree(d, dst)
                  print(f'Copied {d} -> {dst}')
          src_dst = os.path.join(dist, 'src')
          os.makedirs(src_dst, exist_ok=True)
          count = 0
          for f in glob.glob('src/*.py'):
              shutil.copy2(f, src_dst)
              count += 1
          print(f'Copied {count} .py files to {src_dst}')

      - name: Copy getting-started guide
        shell: python
        run: |
          import shutil
          shutil.copy2('GETTING_STARTED.txt', 'dist/NLP_Suite/GETTING_STARTED.txt')
          print('Copied GETTING_STARTED.txt')

      - name: Copy platform-specific DLLs (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $dist = "dist/NLP_Suite"
          # Copy any missing DLLs that PyInstaller warns about
          $dlls = @("tk86t.dll", "tcl86t.dll", "sqlite3.dll")
          foreach ($dll in $dlls) {
            $found = Get-ChildItem $pythonDir -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName $dist -ErrorAction SilentlyContinue
              Write-Host "Copied $dll"
            }
          }

      - name: Sign Mac executable
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/NLP_Suite/NLP_Suite
          xattr -dr com.apple.quarantine dist/NLP_Suite/ || true

      - name: Build Mac Setup launcher app
        if: runner.os == 'macOS'
        run: |
          SETUP_DIR="setup-app"
          APP="$SETUP_DIR/NLP Suite Mac Setup.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          BUILD="$SETUP_DIR/.build"
          mkdir -p "$MACOS" "$RESOURCES" "$BUILD"

          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"

          # Build for both architectures
          BUILT_ARCHS=()
          for ARCH in arm64 x86_64; do
            OUTPUT="$BUILD/NLP-Suite-Mac-Setup-$ARCH"
            if xcrun swiftc \
              -sdk "$SDK_PATH" \
              -target "${ARCH}-apple-macosx11.0" \
              -framework AppKit \
              "setup-app/Sources/main.swift" \
              -o "$OUTPUT"; then
              BUILT_ARCHS+=("$OUTPUT")
              echo "Built for $ARCH"
            fi
          done

          if [ ${#BUILT_ARCHS[@]} -eq 2 ]; then
            xcrun lipo -create "${BUILT_ARCHS[@]}" -output "$MACOS/NLP-Suite-Mac-Setup"
            echo "Created universal binary"
          elif [ ${#BUILT_ARCHS[@]} -eq 1 ]; then
            cp "${BUILT_ARCHS[0]}" "$MACOS/NLP-Suite-Mac-Setup"
            echo "Created single-arch binary"
          else
            echo "Could not compile Setup app" >&2
            exit 1
          fi

          cp "setup-app/Resources/environment_probe.py" "$RESOURCES/"
          cp "setup-app/Resources/sitecustomize.py" "$RESOURCES/"
          chmod +x "$MACOS/NLP-Suite-Mac-Setup"

          cat > "$CONTENTS/Info.plist" <<-'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>NLP Suite Mac Setup</string>
            <key>CFBundleExecutable</key>
            <string>NLP-Suite-Mac-Setup</string>
            <key>CFBundleIdentifier</key>
            <string>org.nlpsuite.macsetup</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>NLP Suite Mac Setup</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>2.2</string>
            <key>CFBundleVersion</key>
            <string>4</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP"
          echo "Signed Setup app"

          # Bundle into dist alongside NLP_Suite
          cp -R "$APP" "dist/NLP_Suite/NLP Suite Mac Setup.app"
          echo "Bundled Setup app into dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/NLP_Suite/
          retention-days: 30

  # Create a GitHub Release with all three builds when triggered by a tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Zip artifacts
        run: |
          cd NLP-Suite-windows-x64 && zip -r ../NLP-Suite-windows-x64.zip . && cd ..
          cd NLP-Suite-mac-arm64 && zip -r ../NLP-Suite-mac-arm64.zip . && cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            NLP-Suite-windows-x64.zip
            NLP-Suite-mac-arm64.zip
          generate_release_notes: true
